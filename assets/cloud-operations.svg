<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Animated cloud and DevOps operations console</title>
  <desc id="desc">A multi-cloud engineering console showing Terraform planning, Ansible configuration, deployment flow, security checks, observability, and cloud cost controls.</desc>

  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="478" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace">
    <rect x="1" y="1" width="1198" height="478" rx="16" fill="#0d1117"/>
    <rect x="1" y="1" width="1198" height="478" rx="16" fill="none" stroke="#30363d" stroke-width="2"/>
    <rect x="1" y="1" width="1198" height="55" fill="#161b22"/>
    <path d="M1 55H1199" stroke="#30363d"/>
    <circle cx="28" cy="28" r="6" fill="#ff5f56"/>
    <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
    <circle cx="72" cy="28" r="6" fill="#27c93f"/>
    <text x="600" y="34" text-anchor="middle" fill="#8b949e" font-size="14">arthur@cachyos: ~/infrastructure</text>
    <text x="1168" y="34" text-anchor="end" fill="#484f58" font-size="11">CLOUD OPERATIONS</text>

    <!-- left: IaC and configuration terminal -->
    <text x="38" y="88" fill="#6e7681" font-size="12" letter-spacing="1.5">INFRASTRUCTURE AS CODE</text>
    <text x="38" y="117" fill="#7ee787" font-size="14">$ <tspan fill="#f0f6fc">terraform plan</tspan></text>
    <g font-size="13">
      <text x="51" y="146" fill="#7ee787">+</text><text x="70" y="146" fill="#c9d1d9">network</text><text x="185" y="146" fill="#6e7681">VPC · subnets · routes · NSGs</text>
      <text x="51" y="171" fill="#7ee787">+</text><text x="70" y="171" fill="#c9d1d9">compute</text><text x="185" y="171" fill="#6e7681">EC2 · autoscaling · containers</text>
      <text x="51" y="196" fill="#7ee787">+</text><text x="70" y="196" fill="#c9d1d9">delivery</text><text x="185" y="196" fill="#6e7681">ALB · health checks · TLS</text>
      <text x="51" y="221" fill="#7ee787">+</text><text x="70" y="221" fill="#c9d1d9">observe</text><text x="185" y="221" fill="#6e7681">logs · metrics · alarms</text>
    </g>
    <rect x="38" y="240" width="410" height="5" rx="2.5" fill="#21262d"/>
    <rect x="38" y="240" width="0" height="5" rx="2.5" fill="url(#flow)">
      <animate attributeName="width" values="0;410;410;0" keyTimes="0;.48;.92;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="38" y="273" fill="#58a6ff" font-size="13">Plan:</text>
    <text x="85" y="273" fill="#c9d1d9" font-size="13">reviewable · repeatable · version controlled</text>

    <text x="38" y="314" fill="#7ee787" font-size="14">$ <tspan fill="#f0f6fc">ansible-playbook configure.yml</tspan></text>
    <g font-size="13">
      <text x="51" y="343" fill="#7ee787">ok</text><text x="91" y="343" fill="#c9d1d9">packages · users · services</text>
      <text x="51" y="368" fill="#7ee787">ok</text><text x="91" y="368" fill="#c9d1d9">configuration · permissions · restart</text>
      <text x="51" y="393" fill="#7ee787">ok</text><text x="91" y="393" fill="#c9d1d9">endpoint health verified</text>
    </g>
    <text x="38" y="430" fill="#8b949e" font-size="12">changed=4  failed=0  unreachable=0</text>
    <text x="38" y="458" fill="#7ee787" font-size="13">$</text>
    <rect x="56" y="446" width="8" height="16" fill="#f0f6fc">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- center: delivery lifecycle -->
    <path d="M479 76V455" stroke="#30363d"/>
    <path d="M793 76V455" stroke="#30363d"/>
    <text x="636" y="88" text-anchor="middle" fill="#6e7681" font-size="12" letter-spacing="1.5">DELIVERY FLOW</text>
    <path d="M636 121V408" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
    <path d="M636 121V408" stroke="url(#flow)" stroke-width="2" stroke-dasharray="5 10"/>

    <g font-size="13">
      <g transform="translate(636 127)">
        <circle r="18" fill="#111820" stroke="#58a6ff" stroke-width="2"/>
        <text x="31" y="5" fill="#f0f6fc">CODE</text>
        <text x="-31" y="5" text-anchor="end" fill="#6e7681">Git</text>
      </g>
      <g transform="translate(636 197)">
        <circle r="18" fill="#111820" stroke="#58a6ff" stroke-width="2"/>
        <text x="31" y="5" fill="#f0f6fc">PLAN</text>
        <text x="-31" y="5" text-anchor="end" fill="#6e7681">Terraform</text>
      </g>
      <g transform="translate(636 267)">
        <circle r="18" fill="#111820" stroke="#7ee787" stroke-width="2"/>
        <text x="31" y="5" fill="#f0f6fc">PROVISION</text>
        <text x="-31" y="5" text-anchor="end" fill="#6e7681">AWS · Azure</text>
      </g>
      <g transform="translate(636 337)">
        <circle r="18" fill="#111820" stroke="#7ee787" stroke-width="2"/>
        <text x="31" y="5" fill="#f0f6fc">CONFIGURE</text>
        <text x="-31" y="5" text-anchor="end" fill="#6e7681">Ansible</text>
      </g>
      <g transform="translate(636 407)">
        <circle r="18" fill="#111820" stroke="#7ee787" stroke-width="2"/>
        <text x="31" y="5" fill="#f0f6fc">OBSERVE</text>
        <text x="-31" y="5" text-anchor="end" fill="#6e7681">CloudWatch</text>
      </g>
    </g>
    <circle cx="636" cy="127" r="6" fill="#f0f6fc" filter="url(#glow)">
      <animate attributeName="cy" values="127;197;267;337;407;127" keyTimes="0;.2;.4;.6;.8;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#58a6ff;#58a6ff;#7ee787;#7ee787;#7ee787;#58a6ff" keyTimes="0;.2;.4;.6;.8;1" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- right: security + cost controls -->
    <text x="824" y="88" fill="#6e7681" font-size="12" letter-spacing="1.5">SECURITY CONTROLS</text>
    <rect x="824" y="105" width="338" height="147" rx="8" fill="#111820" stroke="#30363d"/>
    <g font-size="13">
      <text x="844" y="135" fill="#7ee787">PASS</text><text x="901" y="135" fill="#c9d1d9">IAM scope review</text>
      <text x="844" y="164" fill="#7ee787">PASS</text><text x="901" y="164" fill="#c9d1d9">S3 encryption check</text>
      <text x="844" y="193" fill="#58a6ff">SCAN</text><text x="901" y="193" fill="#c9d1d9">security-group exposure</text>
      <text x="844" y="222" fill="#7ee787">PASS</text><text x="901" y="222" fill="#c9d1d9">CloudTrail visibility</text>
    </g>
    <circle cx="1140" cy="189" r="5" fill="#58a6ff" filter="url(#glow)">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <text x="824" y="287" fill="#6e7681" font-size="12" letter-spacing="1.5">CLOUD COST CONTROL</text>
    <rect x="824" y="304" width="338" height="151" rx="8" fill="#111820" stroke="#30363d"/>
    <text x="844" y="334" fill="#c9d1d9" font-size="13">resource inventory</text>
    <text x="1140" y="334" text-anchor="end" fill="#7ee787" font-size="13">VISIBLE</text>
    <text x="844" y="363" fill="#c9d1d9" font-size="13">budget alerts</text>
    <text x="1140" y="363" text-anchor="end" fill="#7ee787" font-size="13">ARMED</text>
    <text x="844" y="392" fill="#c9d1d9" font-size="13">idle resources</text>
    <text x="1140" y="392" text-anchor="end" fill="#ffbd2e" font-size="13">FLAGGED</text>
    <text x="844" y="421" fill="#c9d1d9" font-size="13">lab teardown</text>
    <text x="1140" y="421" text-anchor="end" fill="#58a6ff" font-size="13">READY</text>
    <rect x="844" y="437" width="296" height="4" rx="2" fill="#21262d"/>
    <rect x="844" y="437" width="0" height="4" rx="2" fill="#7ee787">
      <animate attributeName="width" values="0;296;296;0" keyTimes="0;.55;.92;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
