<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">GPU validation telemetry terminal</title>
  <desc id="desc">An animated terminal-style validation run for an RTX 3070 showing NVML health, CUDA burn telemetry, network checks, and a PROVISION gate decision.</desc>

  <defs>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <clipPath id="terminal-clip">
      <rect x="1" y="1" width="1198" height="518" rx="16"/>
    </clipPath>
    <filter id="status-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#terminal-clip)">
    <rect x="1" y="1" width="1198" height="518" rx="16" fill="#0d1117"/>
    <rect x="1" y="1" width="1198" height="518" rx="16" fill="none" stroke="#30363d" stroke-width="2"/>
    <rect x="1" y="1" width="1198" height="55" fill="#161b22"/>
    <path d="M1 55H1199" stroke="#30363d"/>

    <circle cx="28" cy="28" r="6" fill="#ff5f56"/>
    <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
    <circle cx="72" cy="28" r="6" fill="#27c93f"/>
    <text x="600" y="34" text-anchor="middle" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="14">arthur@cachyos: ~/lab/gpu-validation</text>
    <text x="1167" y="34" text-anchor="end" fill="#484f58" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12">DEMO RUN</text>

    <path d="M748 76V490" stroke="#30363d"/>

    <!-- left: pipeline output -->
    <g font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace">
      <text x="42" y="92" fill="#7ee787" font-size="15">$ <tspan fill="#f0f6fc">ansible-playbook -i ansible/inventory.ini ansible/playbooks/onboard.yml</tspan></text>
      <text x="42" y="122" fill="#8b949e" font-size="13">PLAY [validate GPU node before fleet onboarding]</text>

      <g font-size="14">
        <text x="42" y="164" fill="#484f58">01</text>
        <text x="76" y="164" fill="#c9d1d9">NVML health</text>
        <text x="275" y="164" fill="#8b949e">temp · power · VRAM · PCIe · ECC</text>
        <text x="694" y="164" text-anchor="end" fill="#7ee787" font-weight="700">PASS</text>

        <text x="42" y="205" fill="#484f58">02</text>
        <text x="76" y="205" fill="#c9d1d9">CUDA burn</text>
        <text x="275" y="205" fill="#8b949e">10s · 2 GiB · NVML under load</text>
        <text x="694" y="205" text-anchor="end" fill="#58a6ff" font-weight="700">
          RUNNING
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.55;.56;.93;1" dur="10s" repeatCount="indefinite"/>
        </text>
        <text x="694" y="205" text-anchor="end" fill="#7ee787" font-weight="700" opacity="0">
          PASS
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.55;.56;.93;1" dur="10s" repeatCount="indefinite"/>
        </text>
        <rect x="275" y="217" width="419" height="5" rx="2.5" fill="#21262d"/>
        <rect x="275" y="217" width="0" height="5" rx="2.5" fill="url(#progress)">
          <animate attributeName="width" values="0;419;419;0" keyTimes="0;.55;.93;1" dur="10s" repeatCount="indefinite"/>
        </rect>

        <text x="42" y="258" fill="#484f58">03</text>
        <text x="76" y="258" fill="#c9d1d9">Network readiness</text>
        <text x="275" y="258" fill="#8b949e">DHCP · IPv6 · gateway · external</text>
        <text x="694" y="258" text-anchor="end" fill="#7ee787" font-weight="700">PASS</text>

        <text x="42" y="299" fill="#484f58">04</text>
        <text x="76" y="299" fill="#c9d1d9">Report reconcile</text>
        <text x="275" y="299" fill="#8b949e">PCIe idle WARN → load PASS</text>
        <text x="694" y="299" text-anchor="end" fill="#7ee787" font-weight="700">17 CHECKS</text>

        <text x="42" y="340" fill="#484f58">05</text>
        <text x="76" y="340" fill="#c9d1d9">Submit report</text>
        <text x="275" y="340" fill="#8b949e">POST /validate · external gate</text>
        <text x="694" y="340" text-anchor="end" fill="#7ee787" font-weight="700">HTTP 200</text>
      </g>

      <rect x="42" y="378" width="652" height="77" rx="8" fill="#111820" stroke="#238636"/>
      <circle cx="67" cy="404" r="5" fill="#7ee787" filter="url(#status-glow)">
        <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="85" y="409" fill="#8b949e" font-size="13">GATE DECISION</text>
      <text x="85" y="439" fill="#7ee787" font-size="25" font-weight="700" letter-spacing="2">PROVISION</text>
      <text x="664" y="437" text-anchor="end" fill="#8b949e" font-size="12">node reports · control plane decides</text>

      <text x="42" y="489" fill="#7ee787" font-size="14">$</text>
      <rect x="61" y="476" width="9" height="17" fill="#f0f6fc">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- right: live telemetry -->
    <g font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace">
      <text x="782" y="92" fill="#f0f6fc" font-size="16" font-weight="700">NVIDIA GeForce RTX 3070</text>
      <text x="782" y="114" fill="#6e7681" font-size="12">NVML DEVICE 0 · gpu_validation_pipeline/1.0</text>

      <text x="782" y="151" fill="#8b949e" font-size="12">GPU UTILIZATION</text>
      <text x="1148" y="151" text-anchor="end" fill="#7ee787" font-size="15">99%</text>
      <rect x="782" y="162" width="366" height="7" rx="3" fill="#21262d"/>
      <rect x="782" y="162" width="360" height="7" rx="3" fill="#238636">
        <animate attributeName="width" values="22;348;360;344;360;22" keyTimes="0;.18;.42;.58;.82;1" dur="10s" repeatCount="indefinite"/>
      </rect>

      <g font-size="13">
        <text x="782" y="205" fill="#8b949e">TEMP</text>
        <text x="930" y="205" fill="#f0f6fc">67°C</text>
        <text x="1148" y="205" text-anchor="end" fill="#6e7681">limit 85°C</text>

        <text x="782" y="235" fill="#8b949e">SM CLOCK</text>
        <text x="930" y="235" fill="#f0f6fc">1785 MHz</text>
        <text x="1148" y="235" text-anchor="end" fill="#7ee787">BOOST HELD</text>

        <text x="782" y="265" fill="#8b949e">POWER</text>
        <text x="930" y="265" fill="#f0f6fc">184.6 W</text>
        <text x="1148" y="265" text-anchor="end" fill="#6e7681">220 W limit</text>

        <text x="782" y="295" fill="#8b949e">PCIe LINK</text>
        <text x="930" y="295" fill="#f0f6fc">Gen1 → Gen3 x16</text>
        <text x="1148" y="295" text-anchor="end" fill="#7ee787">RAMPED</text>

        <text x="782" y="325" fill="#8b949e">VRAM</text>
        <text x="930" y="325" fill="#f0f6fc">8.0 GiB</text>
        <text x="1148" y="325" text-anchor="end" fill="#6e7681">2 GiB burn buffer</text>

        <text x="782" y="355" fill="#8b949e">ECC</text>
        <text x="930" y="355" fill="#f0f6fc">N/A</text>
        <text x="1148" y="355" text-anchor="end" fill="#6e7681">consumer silicon</text>
      </g>

      <text x="782" y="392" fill="#8b949e" font-size="12">LOAD TELEMETRY · 0.5s SAMPLE</text>
      <path d="M782 461H1148M782 425H1148" stroke="#21262d"/>
      <path d="M782 463 L810 462 L838 457 L866 447 L894 432 L922 418 L950 411 L978 405 L1006 408 L1034 402 L1062 406 L1090 400 L1118 404 L1148 399" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="520" stroke-dashoffset="520">
        <animate attributeName="stroke-dashoffset" values="520;0;0;520" keyTimes="0;.55;.93;1" dur="10s" repeatCount="indefinite"/>
      </path>
      <path d="M782 466 L810 466 L838 462 L866 454 L894 443 L922 431 L950 424 L978 417 L1006 414 L1034 412 L1062 409 L1090 408 L1118 406 L1148 405" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="520" stroke-dashoffset="520">
        <animate attributeName="stroke-dashoffset" values="520;0;0;520" keyTimes="0;.55;.93;1" dur="10s" repeatCount="indefinite"/>
      </path>
      <circle cx="1148" cy="399" r="4" fill="#58a6ff">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.52;.56;.93;1" dur="10s" repeatCount="indefinite"/>
      </circle>
      <text x="782" y="489" fill="#58a6ff" font-size="11">■ SM CLOCK</text>
      <text x="894" y="489" fill="#7ee787" font-size="11">■ POWER</text>
      <text x="1148" y="489" text-anchor="end" fill="#484f58" font-size="11">STATIC WARN → DYNAMIC PASS</text>
    </g>
  </g>
</svg>
